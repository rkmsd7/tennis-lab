<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.svg"><link rel="stylesheet" href="/css/style.css"><script src="/js/common.js"></script><script src="/js/anim.js"></script><script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script><title>Player — Tennis Lab</title></head><body>
<div id="site-header"></div>
<main class="wrap" id="main"><p class="muted" style="padding:40px 0">Loading…</p></main>
<div id="site-footer"></div>
<script>
(async()=>{
 const [P,S,RV]=await TL.load('players','shots','rivalries'); let V={matches:{},rivalries:{},shots:{},players:{}}; try{[V]=await TL.load('videos');}catch(e){}
 const id=TL.q().id; const p=P.find(x=>x.id===id);
 const main=document.getElementById('main');
 if(!p){main.innerHTML='<section class="hero"><h1>Player not found</h1><p><a href="/players">Back to players</a></p></section>';return;}
 document.title=`${p.name} — profile, equipment and signature shots — Tennis Lab`;
 const total=TL.slams(p); const stars=n=>'★'.repeat(n)+'☆'.repeat(5-n);
 const rivals=RV.filter(r=>r.a===p.name||r.b===p.name).map(r=>{const other=r.a===p.name?r.b:r.a;const o=P.find(x=>x.name===other);return {r,other,o}}).filter(x=>x.o);
 const nearby=P.filter(x=>x.featured&&x.tour===p.tour&&x!==p).sort((a,b)=>Math.abs(a.born-p.born)-Math.abs(b.born-p.born)).slice(0,6);
 main.innerHTML=`
 <section class="hero" style="padding:36px 0 8px"><div class="kicker"><a href="/players" style="color:inherit;text-decoration:none">← Players</a> · ${p.tour==='ATP'?'Men':'Women'} · ${TL.esc(TL.eraLabel[p.era])}</div><h1>${TL.flag(p)} ${TL.esc(p.name)}</h1><p class="lead">${TL.esc(p.style||'')}</p></section>
 <div class="profile-head">
  <div class="card"><p>${TL.esc(p.bio||'')}</p>
   <div class="bigslams"><div><b>${total}</b><span>MAJORS</span></div><div><b>${p.slams.ao}</b><span>AUS OPEN</span></div><div><b>${p.slams.rg}</b><span>ROLAND G.</span></div><div><b>${p.slams.w}</b><span>WIMBLEDON</span></div><div><b>${p.slams.uso}</b><span>US OPEN</span></div></div>
   <dl class="kv"><dt>Born</dt><dd>${p.born}</dd><dt>Plays</dt><dd>${p.hand==='L'?'Left-handed':'Right-handed'}, ${p.backhand==='1'?'one-handed':'two-handed'} backhand</dd><dt>Olympics</dt><dd>${TL.esc(p.olympics||'—')}</dd><dt>Weeks at No. 1</dt><dd>${p.weeksNo1==null?'Active (see rankings)':p.weeksNo1||'—'}</dd></dl></div>
  <div class="card"><div class="ribbon">Equipment & grips</div><dl class="kv" style="margin-top:8px"><dt>Racket</dt><dd>${TL.esc(p.racket||'—')}</dd><dt>Strings</dt><dd>${TL.esc(p.strings||'—')}</dd><dt>Forehand grip</dt><dd>${TL.esc(p.grip?.fh||'—')}</dd><dt>Backhand grip</dt><dd>${TL.esc(p.grip?.bh||'—')}</dd><dt>Serve grip</dt><dd>${TL.esc(p.grip?.serve||'—')}</dd></dl><p class="small" style="margin-top:10px"><a href="/grip">Learn these grips →</a> · <a href="/rackets">Racket guide →</a></p>
   <div class="ribbon" style="margin-top:14px">Watch</div><div class="searchall"><a target="_blank" rel="noopener" href="${TL.yt(p.name+' best points')}">▶ Best points</a><a target="_blank" rel="noopener" href="${TL.yt(p.name+' best shots')}">▶ Best shots</a><a target="_blank" rel="noopener" href="${TL.yt(p.name+' slow motion')}">▶ Slow motion</a><a target="_blank" rel="noopener" href="${TL.yt(p.name+' full match')}">▶ Full matches</a><a target="_blank" rel="noopener" href="${TL.yt(p.name+' documentary')}">▶ Documentary</a></div></div>
 </div>
 ${(V.players[p.id+'|best']||[]).length?`<h2>Watch ${TL.esc(p.name.split(' ').slice(-1)[0])}</h2><div class="vidgrid">${[...(V.players[p.id+'|best']||[]),...(V.players[p.id+'|slowmo']||[])].slice(0,6).map(v=>TL.video(v)).join('')}</div>`:''}
 <h2 id="shots">Signature shots, step by step</h2>
 <p class="muted">Each stroke is recreated as a 3D mannequin on court and runs through five phases: ready position, unit turn, leg load and racket drop, contact, finish. Drag to orbit, switch views, scrub, or step phase by phase. Stars rate how realistic it is for a club player to copy.</p>
 <div id="shotlist">${(p.shots||[]).map((s,i)=>{const t=S[s.type];return`<div class="card" style="margin-top:16px"><div class="shot"><div id="anim-${i}"></div><div><div class="ribbon">${TL.esc(t.label)} · <span class="stars">${stars(s.replicable)}</span> replicable</div><h3>${TL.esc(s.name)}</h3><div class="badges"><span class="pill clay">Grip: ${TL.esc(s.grip)}</span><span class="pill grass">Stance: ${TL.esc(s.stance)}</span></div><p class="small">${TL.esc(s.why)}</p><b class="small">How ${TL.esc(p.name.split(' ')[0])} does it</b><ol class="cues small">${s.cues.map(c=>`<li>${TL.esc(c)}</li>`).join('')}</ol><b class="small">Common mistakes</b><ul class="cues small muted">${t.mistakes.map(c=>`<li>${TL.esc(c)}</li>`).join('')}</ul><div class="searchall"><a target="_blank" rel="noopener" href="${TL.yt(p.name+' '+t.label+' slow motion')}">▶ More ${TL.esc(t.label.toLowerCase())} clips</a><a target="_blank" rel="noopener" href="${TL.yt(t.label+' technique lesson')}">▶ Technique lesson</a></div></div></div>${(()=>{const vids=V.shots[p.id+'|'+i]||[];if(!vids.length)return'';const v=vids[0];return`<div class="shotmedia" data-shot="${i}"><div><div class="ribbon">The real thing</div>${TL.video(v)}<p class="small muted" style="margin:6px 0 0">${TL.esc(v.title)} · ${TL.esc(v.channel)}</p></div><div><div class="ribbon">GIF loop of the same clip</div><div class="loopbox">${TL.video(v,{loop:true,start:0,end:8})}</div><div class="loopctl">Loop from <input type="number" min="0" value="0" data-loop="${v.id}"> s for <input type="number" min="2" max="30" value="8"> s <button class="btn ghost sm" type="button">Set</button></div></div>${vids.length>1?`<div class="vidgrid" style="grid-column:1/-1">${vids.slice(1).map(x=>TL.video(x)).join('')}</div>`:''}</div>`})()}</div>`}).join('')}</div>
 ${rivals.length?`<h2>Rivalries</h2><p class="muted">Open the archive for any of these in the cross-table.</p><div class="grid">${rivals.map(({r,other,o})=>`<a class="card link" href="/players?h2h=${p.id},${o.id}#crosstable"><div class="ribbon">${r.meetings.length} curated meetings</div><h3>${TL.flag(o)} vs ${TL.esc(other)}</h3><p class="small muted">${TL.esc(r.h2h)}${r.slam&&r.slam!=='—'?' · majors: '+TL.esc(r.slam):''}</p></a>`).join('')}</div>`:''}
 <h2>Contemporaries</h2><div class="grid">${nearby.map(o=>`<a class="card link" href="/player?id=${o.id}"><div class="ribbon">${TL.slams(o)} majors</div><h3>${TL.flag(o)} ${TL.esc(o.name)}</h3><p class="small muted">${TL.esc(o.style)}</p></a>`).join('')}</div>`;
 const webgl=(()=>{try{const c=document.createElement('canvas');return !!(c.getContext('webgl2')||c.getContext('webgl'));}catch(e){return false}})();
 if(webgl){const motion=t=>fetch('/data/motion/'+t+'.json').then(r=>r.ok?r.json():null).catch(()=>null);
  Promise.all([import('/js/anim3d.js'),import('/js/mocap3d.js').catch(()=>null)]).then(([m,mc])=>{(p.shots||[]).forEach(async(s,i)=>{const el=document.getElementById('anim-'+i);const mo=mc&&await motion(s.type);if(mo&&mo.frames&&mo.frames.length)mc.mount(el,S[s.type],mo,{autoplay:true});else m.mount(el,S[s.type],{autoplay:true});});}).catch(()=>{(p.shots||[]).forEach((s,i)=>ShotAnim.mount(document.getElementById('anim-'+i),S[s.type],{autoplay:i===0}));});}
 else document.querySelectorAll('.loopctl button').forEach(b=>b.onclick=()=>{const c=b.parentElement;const [s,d]=[...c.querySelectorAll('input')].map(x=>+x.value);const id=c.querySelector('[data-loop]').dataset.loop;c.previousElementSibling.innerHTML=TL.video({id,title:'clip'},{loop:true,start:s,end:s+d});});
 (p.shots||[]).forEach((s,i)=>ShotAnim.mount(document.getElementById('anim-'+i),S[s.type],{autoplay:i===0}));
})();
</script></body></html>
