<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/assets/favicon.svg"><link rel="stylesheet" href="/css/style.css"><script src="/js/common.js"></script><title>Player — Tennis Lab</title></head><body>
<div id="site-header"></div>
<main class="wrap" id="main"><p class="muted" style="padding:40px 0">Loading…</p></main>
<div id="site-footer"></div>
<script>
(async()=>{
 const [P,S,RV]=await TL.load('players','shots','rivalries'); let V={matches:{},rivalries:{},shots:{},players:{}}; try{[V]=await TL.load('videos');}catch(e){} let SR={}; try{[SR]=await TL.load('slamruns');}catch(e){}
 const id=TL.q().id; const p=P.find(x=>x.id===id);
 const main=document.getElementById('main');
 if(!p){main.innerHTML='<section class="hero"><h1>Player not found</h1><p><a href="/players">Back to players</a></p></section>';return;}
 document.title=`${p.name} — profile, equipment and signature shots — Tennis Lab`; const runs=SR[p.id]||{titles:[],finals:[]};
 const total=TL.slams(p); const stars=n=>'★'.repeat(n)+'☆'.repeat(5-n);
 const rivals=RV.filter(r=>r.a===p.name||r.b===p.name).map(r=>{const other=r.a===p.name?r.b:r.a;const o=P.find(x=>x.name===other);return {r,other,o}}).filter(x=>x.o);
 const nearby=P.filter(x=>x.featured&&x.tour===p.tour&&x!==p).sort((a,b)=>Math.abs(a.born-p.born)-Math.abs(b.born-p.born)).slice(0,6);
 const slamHtml=(()=>{const SL={ao:'Australian Open',rg:'Roland Garros',w:'Wimbledon',uso:'US Open'};const seed=x=>x?` <span class="muted small">[${TL.esc(x)}]`+'</span>':'';
  const road=r=>`<table class="road"><tbody>${r.road.map(m=>`<tr class="${m.win?'':'lost'}"><td class="rd">${TL.esc(m.round)}</td><td>${TL.esc(m.opp)}${seed(m.oppSeed)}</td><td class="sc">${TL.esc(m.score||'—')}</td></tr>`).join('')}<tr class="fin"><td class="rd">Final</td><td><b>${TL.esc(r.opp)}</b>${seed(r.oppSeed)}</td><td class="sc"><b>${TL.esc(r.score||'—')}</b></td></tr></tbody></table>`;
  const title=r=>{const ev=SL[r.slam];const q=TL.yt(`${p.name} vs ${r.opp} ${ev} ${r.year} final`);return`<details class="card slamrun"><summary><span class="yr">${r.year}</span><span class="ev">${ev}${r.note?' ('+r.note+')':''}</span><span class="small muted">${r.seed?'Seeded '+TL.esc(r.seed)+' · ':''}d. ${TL.esc(r.opp)} ${TL.esc(r.score)}</span><span class="pill">${r.road.length+1} matches</span></summary>${road(r)}<div class="searchall"><a href="/tournaments?draw=${r.year}|${r.slam}|${p.tour==='ATP'?'Men':'Women'}#draws">Full draw →</a><a target="_blank" rel="noopener" href="${q}">▶ Watch the final</a><a target="_blank" rel="noopener" href="${TL.yt(`${p.name} ${ev} ${r.year} highlights`)}">▶ Tournament highlights</a></div></details>`};
  if(!runs.titles.length&&!runs.finals.length&&!(runs.olympics||[]).length)return'';
  const openEra=runs.titles.filter(r=>r.year>=1968).length;return`<h2 id="slams">Grand Slam titles, round by round</h2><p class="muted">${runs.titles.length} title${runs.titles.length===1?'':'s'}${openEra!==runs.titles.length?` (${openEra} in the Open Era)`:''}${runs.finals.length?` and ${runs.finals.length} runner-up final${runs.finals.length===1?'':'s'}`:''}. Open a title to see the full road to the trophy: every round, every opponent, every score. Draws from Wikipedia.</p><div class="slamruns">${runs.titles.slice().reverse().map(title).join('')}</div>${runs.finals.length?`<h3 style="margin-top:18px">Finals lost</h3><div class="slamruns">${runs.finals.slice().reverse().map(r=>{const ev=SL[r.slam];return`<details class="card slamrun lostfinal"><summary><span class="yr">${r.year}</span><span class="ev">${ev}</span><span class="small muted">lost to ${TL.esc(r.opp)} ${TL.esc(r.score)}</span><span class="pill">final</span></summary>${road(r)}</details>`}).join('')}</div>`:''}${(runs.olympics||[]).length?`<h3 style="margin-top:18px">Olympic finals</h3><div class="slamruns">${runs.olympics.slice().reverse().map(r=>`<details class="card slamrun ${r.gold?'':'lostfinal'}"><summary><span class="yr">${r.year}</span><span class="ev">Olympic Games · ${r.gold?'🥇 Gold':'🥈 Silver'}</span><span class="small muted">${r.gold?'d.':'lost to'} ${TL.esc(r.opp)} ${TL.esc(r.score)}</span><span class="pill">${r.road.length+1} matches</span></summary>${road(r)}<div class="searchall"><a target="_blank" rel="noopener" href="${TL.yt(`${p.name} ${r.year} olympics final`)}">▶ Watch the final</a><a href="/tournaments?draw=${r.year}|oly|${p.tour==='ATP'?'Men':'Women'}#draws">Full draw →</a></div></details>`).join('')}</div>`:''}`})();
 main.innerHTML=`
 <section class="hero" style="padding:36px 0 8px"><div class="kicker"><a href="/players" style="color:inherit;text-decoration:none">← Players</a> · ${p.tour==='ATP'?'Men':'Women'} · ${TL.esc(TL.eraLabel[p.era])}</div><h1>${TL.flag(p)} ${TL.esc(p.name)}</h1><p class="lead">${TL.esc(p.style||'')}</p></section>
 <div class="profile-head">
  <div class="card"><p>${TL.esc(p.bio||'')}</p>
   <div class="bigslams"><div><b>${total}</b><span>MAJORS</span></div><div><b>${p.slams.ao}</b><span>AUS OPEN</span></div><div><b>${p.slams.rg}</b><span>ROLAND G.</span></div><div><b>${p.slams.w}</b><span>WIMBLEDON</span></div><div><b>${p.slams.uso}</b><span>US OPEN</span></div></div>
   <dl class="kv"><dt>Born</dt><dd>${p.born}</dd><dt>Plays</dt><dd>${p.hand==='L'?'Left-handed':'Right-handed'}, ${p.backhand==='1'?'one-handed':'two-handed'} backhand</dd><dt>Olympics</dt><dd>${TL.esc(p.olympics||'—')}</dd><dt>Weeks at No. 1</dt><dd>${p.weeksNo1==null?'Active (see rankings)':p.weeksNo1||'—'}</dd></dl></div>
  <div class="card"><div class="ribbon">Equipment & grips</div><dl class="kv" style="margin-top:8px"><dt>Racket</dt><dd>${TL.esc(p.racket||'—')}</dd><dt>Strings</dt><dd>${TL.esc(p.strings||'—')}</dd><dt>Forehand grip</dt><dd>${TL.esc(p.grip?.fh||'—')}</dd><dt>Backhand grip</dt><dd>${TL.esc(p.grip?.bh||'—')}</dd><dt>Serve grip</dt><dd>${TL.esc(p.grip?.serve||'—')}</dd></dl><p class="small" style="margin-top:10px"><a href="/grip">Learn these grips →</a> · <a href="/rackets">Racket guide →</a></p>
   <div class="ribbon" style="margin-top:14px">Watch</div><div class="searchall"><a target="_blank" rel="noopener" href="${TL.yt(p.name+' best points')}">▶ Best points</a><a target="_blank" rel="noopener" href="${TL.yt(p.name+' best shots')}">▶ Best shots</a><a target="_blank" rel="noopener" href="${TL.yt(p.name+' slow motion')}">▶ Slow motion</a><a target="_blank" rel="noopener" href="${TL.yt(p.name+' full match')}">▶ Full matches</a><a target="_blank" rel="noopener" href="${TL.yt(p.name+' documentary')}">▶ Documentary</a></div></div>
 </div>
 ${(V.players[p.id+'|best']||[]).length?`<h2>Watch ${TL.esc(p.name.split(' ').slice(-1)[0])}</h2><div class="vidgrid">${[...(V.players[p.id+'|best']||[]),...(V.players[p.id+'|slowmo']||[])].slice(0,6).map(v=>TL.video(v)).join('')}</div>`:''}
 ${slamHtml}
 <h2 id="shots">Signature shots, step by step</h2>
 <p class="muted">Each signature shot comes with the real clip from YouTube, a muted GIF-style loop you can set to the exact swing, the grip and stance used, and step-by-step cues. Stars rate how realistic it is for a club player to copy.</p>
 <div id="shotlist">${(p.shots||[]).length?'':`<div class="card"><p class="muted">No curated shot breakdown for ${TL.esc(p.name)} yet. <a target="_blank" rel="noopener" href="${TL.yt(p.name+' slow motion technique')}">▶ Watch ${TL.esc(p.name.split(' ').slice(-1)[0])}'s technique on YouTube</a></p></div>`}${(p.shots||[]).map((s,i)=>{const t=S[s.type];return`<div class="card" style="margin-top:16px"><div class="shot">${(()=>{const vids=V.shots[p.id+'|'+i]||[];const v=vids[0];if(!v)return`<div class="shotvideo"><div class="yt" style="display:flex;align-items:center;justify-content:center"><a class="btn" target="_blank" rel="noopener" href="${TL.yt(p.name+' '+t.label+' slow motion')}">▶ Find ${TL.esc(p.name.split(' ').slice(-1)[0])}'s ${TL.esc(t.label.toLowerCase())} on YouTube</a></div></div>`;return`<div class="shotvideo"><div class="ribbon">Watch the real shot</div>${TL.video(v)}<p class="small muted" style="margin:6px 0 10px">${TL.esc(v.title)} · ${TL.esc(v.channel)}</p><div class="ribbon">GIF loop of the same clip</div><div class="loopbox">${TL.video(v,{loop:true,start:0,end:8})}</div><div class="loopctl">Loop from <input type="number" min="0" value="0" data-loop="${v.id}"> s for <input type="number" min="2" max="30" value="8"> s <button class="btn ghost sm" type="button">Set</button></div></div>`})()}<div><div class="ribbon">${TL.esc(t.label)} · <span class="stars">${stars(s.replicable)}</span> replicable</div><h3>${TL.esc(s.name)}</h3><div class="badges"><span class="pill clay">Grip: ${TL.esc(s.grip)}</span><span class="pill grass">Stance: ${TL.esc(s.stance)}</span></div><p class="small">${TL.esc(s.why)}</p><b class="small">How ${TL.esc(p.name.split(' ')[0])} does it</b><ol class="cues small">${s.cues.map(c=>`<li>${TL.esc(c)}</li>`).join('')}</ol><b class="small">Common mistakes</b><ul class="cues small muted">${t.mistakes.map(c=>`<li>${TL.esc(c)}</li>`).join('')}</ul><div class="searchall"><a target="_blank" rel="noopener" href="${TL.yt(p.name+' '+t.label+' slow motion')}">▶ More ${TL.esc(t.label.toLowerCase())} clips</a><a target="_blank" rel="noopener" href="${TL.yt(t.label+' technique lesson')}">▶ Technique lesson</a></div></div></div>${(V.shots[p.id+'|'+i]||[]).length>1?`<div class="vidgrid" style="margin-top:12px">${V.shots[p.id+'|'+i].slice(1).map(x=>TL.video(x)).join('')}</div>`:''}</div>`}).join('')}</div>
 ${rivals.length?`<h2>Rivalries</h2><p class="muted">Open the archive for any of these in the cross-table.</p><div class="grid">${rivals.map(({r,other,o})=>`<a class="card link" href="/players?h2h=${p.id},${o.id}#crosstable"><div class="ribbon">${r.meetings.length} curated meetings</div><h3>${TL.flag(o)} vs ${TL.esc(other)}</h3><p class="small"><span class="plink-inline" data-go="/player?id=${o.id}">${TL.esc(other)}'s profile →</span></p><p class="small muted">${TL.esc(r.h2h)}${r.slam&&r.slam!=='—'?' · majors: '+TL.esc(r.slam):''}</p></a>`).join('')}</div>`:''}
 <h2>Contemporaries</h2><div class="grid">${nearby.map(o=>`<a class="card link" href="/player?id=${o.id}"><div class="ribbon">${TL.slams(o)} majors</div><h3>${TL.flag(o)} ${TL.esc(o.name)}</h3><p class="small muted">${TL.esc(o.style)}</p></a>`).join('')}</div>`;
 document.querySelectorAll('[data-go]').forEach(s=>s.onclick=e=>{e.preventDefault();e.stopPropagation();location.href=s.dataset.go});
 document.querySelectorAll('.loopctl button').forEach(b=>b.onclick=()=>{const c=b.parentElement;const [s,d]=[...c.querySelectorAll('input')].map(x=>+x.value);const id=c.querySelector('[data-loop]').dataset.loop;c.previousElementSibling.innerHTML=TL.video({id,title:'clip'},{loop:true,start:s,end:s+d});});
})();
</script></body></html>
